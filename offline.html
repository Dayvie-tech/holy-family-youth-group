<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#168fc9">
  <meta name="robots" content="noindex">
  <title>You're offline | Holy Family Youth Group</title>
  <link rel="icon" href="holy-family-youth-group-logo.jpg" type="image/jpeg">
  <style>
    .offline-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f8fb}
    .offline-card{width:min(100%,560px);padding:clamp(28px,6vw,52px);border-radius:22px;background:#fff;text-align:center;box-shadow:0 18px 55px rgba(12,66,101,.12)}
    .offline-card img{width:104px;height:104px;object-fit:contain;margin:0 auto 22px}
    .offline-card h1{color:#0c4265;margin:0 0 12px}
    .offline-card p{color:#526575;line-height:1.7}
    .offline-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}
  </style>
</head>
<body>
  <main class="offline-shell">
    <section class="offline-card">
      <img src="holy-family-youth-group-logo.jpg" alt="Holy Family Youth Group logo">
      <p class="eyebrow blue">HOLY FAMILY YOUTH GROUP</p>
      <h1>You're currently offline</h1>
      <p>Your connection is unavailable. The secure member portal, live announcements and other online features need an internet connection. Please reconnect and try again.</p>
      <div class="offline-actions">
        <a class="button" href="index.html">Try again</a>
      </div>
    </section>
  </main>
</body>
</html>
