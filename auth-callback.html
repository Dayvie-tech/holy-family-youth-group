<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirming email | Holy Family Youth Group</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="container">
      <section class="auth-card narrow">
        <img class="auth-logo" src="holy-family-youth-group-logo.jpg" alt="Official Holy Family Youth Group logo">
        <header class="auth-heading">
          <p class="eyebrow blue">EMAIL VERIFICATION</p>
          <h1>Confirming your email</h1>
          <p id="callback-status" class="auth-status" role="status" aria-live="polite">Please wait while we verify your email address…</p>
        </header>
        <p class="auth-foot"><a class="text-link" href="login.html">Go to sign in</a></p>
      </section>
    </div>
  </main>
  <script type="module" src="auth-pages.js"></script>
</body>
</html>
